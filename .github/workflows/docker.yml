name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test (${{ matrix.tag }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: "php/5.6"
            tag: "php-5.6"
          - context: "php/7.0"
            tag: "php-7.0"
          - context: "php/7.1"
            tag: "php-7.1"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build image"
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.context }}"
          load: true
          tags: "dockette/upstream:${{ matrix.tag }}"

      - name: "Test image"
        run: "make test DOCKER_TAG=${{ matrix.tag }}"

  build:
    name: "Build"
    needs: ["test"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/upstream"
      tag: "${{ matrix.tag }}"
      context: "${{ matrix.context }}"
      platforms: "linux/amd64"
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: "php/5.6"
            tag: "php-5.6"
          - context: "php/7.0"
            tag: "php-7.0"
          - context: "php/7.1"
            tag: "php-7.1"

  docs:
    name: "Docs"
    runs-on: "ubuntu-latest"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Update Docker Hub description"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: "dockette/upstream"
