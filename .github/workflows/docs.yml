name: Docs

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README
        run: |
          test -f README.md
          ! grep -Eiq 'slack|join\.slack|gitter|badgen\.net' README.md
          grep -F 'This repository is archived legacy content.' README.md
          grep -F 'Docker Hub pulls badge is omitted' README.md
          grep -F 'See [how to contribute](https://github.com/dockette/.github/blob/master/CONTRIBUTING.md)' README.md
